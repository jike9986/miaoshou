appId: com.aohuang.listing
productName: 奥皇上品
copyright: Copyright © 2026 AOHUANG
directories:
  output: ../release
  buildResources: build
files:
  - dist/**/*
  - package.json
# 只保留中文语言包。Electron 默认带 55 个 locale（合计约 39MB），
# 而这个软件只有中文界面，其余 54 个永远不会被加载，纯占体积。
# electron-builder 会在打完目录包后按这个列表删掉不匹配的 .pak。
electronLanguages:
  - zh-CN
extraResources:
  - from: ../web/dist
    to: web
  # 正式客户端通过 HTTPS 访问服务器，不分发本地后端或共享客户端令牌。
extraFiles:
  # 启动器必须落在 exe 同级目录（不是 resources/），所以用 extraFiles。
  # 本机必须命令行带 --no-sandbox 才能起窗口，原因见 build/launch.bat 顶部。
  - from: build/launch.bat
    to: launch.bat
  - from: build/launch.bat
    to: 启动 奥皇上品.bat
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: 奥皇上品-${version}-Setup.${ext}
  # exe 用纯 ASCII 名：本机启动脚本/快捷方式要用它拼命令行，
  # 中文路径在 cmd / makensis 下会被按 GBK 误解码（实测 '奥皇上品' 变成乱码）。
  # 用户看到的中文全部来自快捷方式名和窗口标题，不受影响。
  executableName: AohuangShangpin
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: 奥皇上品
  deleteAppDataOnUninstall: false
  language: "2052"
  installerLanguages:
    - zh_CN
  # 快捷方式通过 customInstall 宏用 PowerShell 创建（见 build/installer.nsh）：
  # 1. 保证带 --no-sandbox 参数（这里没有内置选项支持自定义快捷方式参数）
  # 2. 避免 makensis 在中文路径环境下对 CJK 字符的 GBK 误解码
  include: build/installer.nsh
