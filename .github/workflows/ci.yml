# 奥皇上品 · 桌面端 CI
#
# 设计约束（很重要，别随手改）：
#   1. **不需要妙手账号**。CI 里没有 AppKey / AppSecret，也没有真实 app.db。
#      所有 job 只做静态检查、类型检查、构建和临时库上的迁移验证，
#      任何需要上游凭据的冒烟脚本（scripts/smoke_live.py、regression.py）都不进 CI。
#   2. **不部署**。没有服务器凭据，打包与部署仍由 scripts/build.ps1 +
#      scripts/deploy.ps1 在本机手工执行（见 README「部署」）。
#   3. 迁移验证一律把 AOHUANG_DATA_DIR 指到临时目录，绝不碰真实 app.db。
#
# 三个 job：
#   python            后端静态检查 + 测试 + 迁移自检（3.11 / 3.12 矩阵）
#   web               前端类型检查 + lint + 构建
#   version-consistency 版本号四处一致（漏改一处就会被打包进不一致的版本）
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支（同一 PR）来了新 push 就取消还在跑的旧 run：
# 矩阵 + 构建最慢两分钟，不取消的话排队会越积越长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读权限：CI 不写仓库、不发版、不推镜像
permissions:
  contents: read

env:
  # 兜底：任何步骤意外触发的后端导入都落临时目录，不会写进仓库里的 server/app.db
  AOHUANG_DATA_DIR: ${{ github.workspace }}/.ci-data
  # 明确关掉 pip 的交互提示，避免日志里出现被忽略的警告
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # 一个版本挂了先让另一个跑完，能一次看到两个版本的结果
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache 的 key 由 requirements 文件的内容哈希决定，依赖变了才会重装。
          # 用通配符而不是逐个列文件名：requirements-dev.txt 可能还不存在，
          # 列死会让 hash 计算落空（缓存永远 miss）。
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f server/requirements-dev.txt ]; then
            # requirements-dev.txt 里已包含 -r requirements.txt 与 ruff/pytest/mypy
            python -m pip install -r server/requirements-dev.txt
          else
            # 兜底路径：开发依赖文件还没落地时也能跑（另一个 agent 正在建）
            python -m pip install -r server/requirements.txt
            python -m pip install ruff pytest mypy
          fi

      # ruff 规则集与排除项在 server/pyproject.toml 的 [tool.ruff] 里。
      # 那里刻意没开 ALL：存量 19k 行代码全量规则会报几百条风格告警
      # （import 排序、noqa 冗余等），一上来全开等于没有 CI。
      - name: ruff check
        working-directory: server
        run: python -m ruff check .

      # server/tests 由另一个 agent 在建，未落地前跳过而不是 fail
      - name: pytest
        working-directory: server
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "::notice title=pytest 跳过::server/tests 尚未建立，先跳过测试"
          fi

      # 类型标注是存量的债（当前 44 条 error / 17 个文件），不能一上来就红。
      # 先作为「可见但不阻塞」的信号，等存量收紧后再去掉 continue-on-error。
      - name: mypy（暂不阻塞）
        working-directory: server
        continue-on-error: true
        run: python -m mypy services core

      # 迁移冒烟：临时库里从零 upgrade head → 报表与索引/外键 → downgrade base
      # → 断言业务表清空。脚本自己把 AOHUANG_DATA_DIR 覆盖成 mktemp 目录，
      # 与真实 app.db 无关，也不需要妙手账号。
      # 逻辑写在 server/scripts/ci_migration_check.py 里而不是内联，是为了
      # 本地也能一条命令复跑（内联 heredoc 在 YAML 里对齐出错很难查）。
      - name: Alembic 迁移冒烟（临时库）
        working-directory: server
        run: python scripts/ci_migration_check.py

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # 锁文件在仓库根，workspace 是 app/ + web/
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 脚本名按 web/package.json 实际内容（已核对）：
      #   typecheck = tsc --noEmit
      #   lint      = eslint .
      #   build     = tsc -b && vite build
      - name: typecheck（tsc --noEmit）
        run: pnpm --filter web typecheck

      # web/eslint.config.js 是 ESLint 9 flat config，已配置完成。
      # 保留 continue-on-error 是因为存量代码还有一批 warning、规则集仍在收敛，
      # 待 lint 稳定后去掉这一行，让它真正拦住 PR。
      - name: lint（eslint）
        continue-on-error: true
        run: pnpm --filter web lint

      - name: build（tsc -b && vite build）
        run: pnpm --filter web build

  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 版本号散落在 4 个文件里，漏改一处就会出现「安装包 0.1.6 / 界面 0.1.5」，
      # 自动更新据此判成「有新版本」，侧栏挂一个永不消失的角标。
      # 脚本只读文件、不导入项目代码（导入 constants 会触发建数据目录）。
      - name: 校验版本号四处一致
        run: python scripts/check_version.py
