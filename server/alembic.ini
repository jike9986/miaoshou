# Alembic configuration. Run from the server/ directory:
#
#   cd server
#   python -m alembic upgrade head                      # create / upgrade to latest
#   python -m alembic revision --autogenerate -m "..."  # generate migration after model change
#   python -m alembic downgrade -1                      # roll back one step
#
# NOTE: this file is intentionally ASCII-only.
#   Alembic reads alembic.ini with `encoding="locale"` (alembic/util/compat.py).
#   On a Windows host with a GBK locale, a UTF-8 file containing Chinese
#   comments raises UnicodeDecodeError before the migration even starts.
#   Chinese documentation lives in docs/migrations.md and migrations/README.
#
# Full usage and the split of responsibility with
# db/session.py::_add_missing_columns() is documented in docs/migrations.md.

[alembic]
# Migration script directory, resolved relative to this file (server/).
script_location = migrations

# Migration file name: <YYYYMMDD>_<HHMM>_<rev>_<slug>.py
# Timestamp prefix (instead of bare rev) so `ls` orders them chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Put server/ on sys.path so env.py can import core / db / models.
prepend_sys_path = .

# Separator for multiple version locations.
version_path_separator = os

# Migration files contain non-ASCII text (batch comments), so write them as UTF-8.
output_encoding = utf-8

# ---------------------------------------------------------------------------
# The connection URL is deliberately NOT configured here.
#
# The database location comes from core/config.py::get_settings().db_path, and
# data_dir itself is controlled by the AOHUANG_DATA_DIR environment variable
# (default: %LOCALAPPDATA%\aohuang-desktop). Hard-coding sqlite:///... here would
# let the app write to database A while migrations modify database B -- and that
# mismatch is invisible in the output: the migration reports success while the
# application still misses columns.
#
# migrations/env.py therefore injects the URL at runtime via
# config.set_main_option(). The empty value below only keeps the ini structure
# valid; do not put a real path here.
sqlalchemy.url =


[post_write_hooks]
# No automatic formatting of generated migrations: Chinese comments and
# batch_alter_table blocks are easy to mangle, and a reviewer can no longer tell
# whether logic or only whitespace changed. Run `ruff format migrations/` by hand
# when needed.


# Logging configuration (alembic template defaults)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
