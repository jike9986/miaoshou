[project]
name = "aohuang-server"
version = "0.1.5"
description = "奥皇上品 · 后端（FastAPI + SQLite）"
requires-python = ">=3.11"
# 依赖与 requirements.txt 保持同步（那边仍是 PyInstaller 的输入，不能删）。
# 这里用同一批固定版本，避免「pip install -e .」和「pip install -r」装出两套环境。
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.31.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.3",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    # services/crypto.py 用 Fernet 加密 accounts.app_secret_enc
    "cryptography>=42.0.0",
    # services/image_upload.py 的 SFTP 上传通道（HTTP 通道不需要）
    "paramiko>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

# 这个项目不是可安装的包：server/ 下是平铺的 main.py + api/services/... 布局，
# 没有 src 目录也没有包名。声明成包反而要维护一套 setuptools 配置。
# 依赖仍然能从 [project.dependencies] 读（pip install -e . 会建一个只装依赖的空包）。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

# _meas/ 是手写探针，不是产品代码：它们的写法（模块级 init_db、全局
# monkeypatch、sys.path.insert、为打印而生的超长行）本来就该长那样，
# 拿去套产品代码的规则只会产生几百条没人会修的噪音。
# dist/ build/ 是 PyInstaller 产物（里面还有整套第三方包源码），
# 扫它们既慢又毫无意义。
# migrations/ 是 Alembic 的迁移目录，由 `alembic revision` 生成 + 手写少量
# 数据迁移：文件名带时间戳、头部注释格式固定、模板里就是 `Union[...]` 的写法，
# 改它们等于跟 alembic 模板打架，收益为零。
exclude = ["_meas", "migrations", "dist", "build", "__pycache__"]

[tool.ruff.lint]
# 选型理由（一句话/条，见 PR 报告）：
#   E/W  pycodestyle 的空白与行宽 —— 唯一的「格式」底线，且 E501 已按 100 列校准；
#   F    pyflakes：未使用 import / 未定义名 / 未使用变量 —— 这里抓到的是真 bug；
#   I    isort：import 排序，纯机械，--fix 可全自动修；
#   UP   pyupgrade：按 3.11 语法现代化（collections.abc、X | Y、内置泛型）；
#   B    bugbear：可变默认参数、except 里不 from、zip 不写 strict —— 都是真坑；
#   SIM  simplify：可合并的 if / 可 with 的资源 —— 降低阅读成本；
#   C4   comprehensions：多余的推导式（dict(mapping) 比 {k: v for ...} 清楚）；
#   RET  return：多余的中转变量，纯可读性。
# 刻意**不选** ALL：会引入 D（docstring 全覆盖）、ANN（全量类型标注）、
# S（bandit 安全规则，与这个本地工具的性质冲突）、T20（禁止 print，
# 但 run_server.py 就是靠 print 给用户看端口）等，一次性报几千条，
# 结果是所有人一起加 noqa 或者干脆不跑。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
# B008（函数默认值里调函数）与 FastAPI 的依赖注入写法直接冲突：
# `def route(payload: X, db: Session = Depends(get_db))` 是框架规定的签名形状，
# 不是「可变默认参数」那种坑。全部 api/ 豁免，其余 B008 仍然生效。
"api/*.py" = ["B008"]

[tool.ruff.lint.isort]
# 这个项目的第一方包是平铺在 server/ 下的（api / services / core / models /
# db / schemas），没有共同的顶层包名，交给 ruff 自己猜会把它们和第三方混排。
known-first-party = ["api", "core", "db", "models", "schemas", "services", "main"]

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# -q：CI 里只看汇总；--strict-markers：写错 marker 名要报错而不是静默忽略
# （markers 拼错会让「只跑 legacy」之类的筛选悄悄跑空集）。
addopts = "-q --strict-markers"
markers = [
    "legacy: 从 _meas/ 迁移过来的老探针用例（子进程跑，较慢；-m 'not legacy' 可跳过）",
]
filterwarnings = [
    # 已知且无害的 deprecation：升级依赖时先看这里，别让它们淹没真正的警告
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:multipart.*",
    "ignore:.*datetime\\.utcnow.*:DeprecationWarning",
    "ignore:.*'crypt' module.*:DeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
    # httpx 0.27 对 `proxies=` / `app=` 的提示：业务代码用的是 proxy=，不受影响
    "ignore:.*The 'app' shortcut is now deprecated.*:DeprecationWarning",
    # starlette 0.4x 的 TestClient 内部还在用 anyio 的旧别名；等 starlette 升级自会消失
    "ignore:.*anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# 第三方库基本没有 py.typed，逐个装 stub 的成本远大于收益
ignore_missing_imports = true
# 即使函数没写类型标注也检查函数体：19k 行里绝大多数函数没标注，
# 只查已标注的函数等于什么都没查。
check_untyped_defs = true
# 刻意**不开** strict：strict 要求 disallow_untyped_defs / warn_return_any /
# disallow_any_generics 等，19k 行无标注代码会立刻报几千条，
# 结局只有两种——全员忽略，或者把 mypy 从 CI 里删掉。先让它在有类型的地方起作用。
warn_unused_ignores = true
show_error_codes = true
exclude = ["^_meas/", "^migrations/", "^dist/", "^build/", "^tests/"]

# 只查 services/ 和 core/：
#   · services/ 是业务核心，函数边界相对干净，改类型成本最低；
#   · core/ 只有 5 个文件（配置/常量/错误/工具），是全项目的地基，
#     这里错一处所有调用方都错，最值得盯；
#   · api/ 暂不查：路由层大量 Any 出参（直接返回 dict / JSONResponse），
#     且 FastAPI 依赖注入（Depends）在 mypy 眼里是「缺参数」，
#     一个文件能报上百条假阳性，得先上 fastapi 的 mypy 插件才有意义；
#   · models/ 暂不查：SQLAlchemy 2.0 的 Mapped[] 声明式模型在没装
#     sqlalchemy2-stubs 之前，Column 属性一律被推断成 Any/Descriptor，
#     查出来的问题基本都是误报。
# 顺序是先 services+core，等这两块 0 error 了再逐个放开。
[[tool.mypy.overrides]]
module = ["api.*", "models.*", "schemas.*", "db.*", "migrations.*", "main",
          "_meas.*", "tests.*"]
ignore_errors = true
